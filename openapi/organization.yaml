openapi: 3.1.0
info:
  title: MisVales — Organización, sucursales y personal
  version: 2.0.0
  description: Contrato HTTP del Módulo 2. Todas las operaciones requieren sesión activa y MFA completado.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Branches
  - name: Personnel
  - name: Assignments
paths:
  /branches:
    get:
      tags: [Branches]
      summary: Lista sucursales dentro del alcance efectivo
      x-permission: branches.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BranchStatus' }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
        - name: sort
          in: query
          schema: { type: string, enum: [code, name, status, created_at], default: created_at }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Página de sucursales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedBranches' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Branches]
      summary: Crea una sucursal
      x-permission: branches.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreBranch' }
      responses:
        '201':
          description: Sucursal creada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /branches/{id}:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    get:
      tags: [Branches]
      summary: Consulta una sucursal dentro del alcance efectivo
      x-permission: branches.view
      responses:
        '200':
          description: Detalle de sucursal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Branches]
      summary: Modifica código y nombre con control optimista
      x-permission: branches.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBranch' }
      responses:
        '200':
          description: Sucursal modificada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /branches/{id}/activate:
    post:
      tags: [Branches]
      summary: Activa una sucursal
      x-permission: branches.activate
      parameters:
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { $ref: '#/components/responses/BranchResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /branches/{id}/deactivate:
    post:
      tags: [Branches]
      summary: Desactiva una sucursal sin asignaciones activas
      x-permission: branches.deactivate
      parameters:
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { $ref: '#/components/responses/BranchResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /branches/{id}/personnel:
    get:
      tags: [Personnel]
      summary: Lista personal activo de una sucursal autorizada
      x-permission: branches.view
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/RoleIdQuery'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/UserState' }
      responses:
        '200': { $ref: '#/components/responses/PersonnelPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /branches/{id}/assignments:
    get:
      tags: [Assignments]
      summary: Lista asignaciones activas o históricas de una sucursal
      x-permission: branches.view
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/RoleIdQuery'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssignmentStatus' }
        - name: include_history
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/PersonnelPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /personnel:
    get:
      tags: [Personnel]
      summary: Lista personal conforme al alcance efectivo
      x-permission: branches.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: branch_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RoleIdQuery'
        - name: user_state
          in: query
          schema: { $ref: '#/components/schemas/UserState' }
        - name: assignment_status
          in: query
          schema: { $ref: '#/components/schemas/AssignmentStatus' }
      responses:
        '200': { $ref: '#/components/responses/PersonnelPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/assignments:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Assignments]
      summary: Lista asignaciones efectivas; el historial es optativo para compatibilidad
      x-permission: branches.view
      parameters:
        - name: include_history
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Asignaciones visibles dentro del alcance del actor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Assignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Assignments]
      summary: Asigna rol y alcance; una reasignación cierra la vigencia anterior
      x-permission: roles.assign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreAssignment' }
      responses:
        '201':
          description: Asignación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{userId}/assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/AssignmentId'
    patch:
      tags: [Assignments]
      summary: Modifica únicamente vigencia inicial o motivo de una asignación activa
      x-permission: roles.assign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                assigned_at: { type: string, format: date-time }
                assignment_reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Asignación actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Assignments]
      summary: Cierra lógicamente una asignación
      x-permission: roles.assign
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Asignación revocada
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    BranchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleIdQuery:
      name: role_id
      in: query
      schema: { type: string, format: uuid }
  schemas:
    BranchStatus: { type: string, enum: [ACTIVE, INACTIVE] }
    AssignmentStatus: { type: string, enum: [ACTIVE, ENDED, REVOKED] }
    OrganizationScope: { type: string, enum: [GLOBAL, BRANCH, ASSIGNED, SELF] }
    UserState: { type: string, enum: [INVITED, PENDING_ACTIVATION, ACTIVE, BLOCKED, DISABLED] }
    Branch:
      type: object
      required: [id, code, name, is_headquarters, status, lock_version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 150 }
        is_headquarters: { type: boolean }
        status: { $ref: '#/components/schemas/BranchStatus' }
        lock_version: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    StoreBranch:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 20 }
        name: { type: string, minLength: 2, maxLength: 150 }
    UpdateBranch:
      allOf:
        - $ref: '#/components/schemas/StoreBranch'
        - $ref: '#/components/schemas/VersionRequest'
    VersionRequest:
      type: object
      required: [lock_version]
      properties:
        lock_version: { type: integer, minimum: 0 }
    Assignment:
      type: object
      required: [id, user_id, role_id, scope_type, status, assigned_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        branch_id: { type: [string, 'null'], format: uuid }
        scope_type: { $ref: '#/components/schemas/OrganizationScope' }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        assigned_at: { type: string, format: date-time }
        assignment_reason: { type: [string, 'null'], maxLength: 500 }
        revoked_at: { type: [string, 'null'], format: date-time }
        revocation_reason: { type: [string, 'null'] }
    Personnel:
      type: object
      required: [assignment_id, user, role, scope, assignment_status, assigned_at]
      properties:
        assignment_id: { type: string, format: uuid }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            state: { $ref: '#/components/schemas/UserState' }
        role:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        branch_id: { type: [string, 'null'], format: uuid }
        scope: { $ref: '#/components/schemas/OrganizationScope' }
        assignment_status: { $ref: '#/components/schemas/AssignmentStatus' }
        assigned_at: { type: string, format: date-time }
        assignment_reason: { type: [string, 'null'] }
        revoked_at: { type: [string, 'null'], format: date-time }
        revocation_reason: { type: [string, 'null'] }
    StoreAssignment:
      type: object
      additionalProperties: false
      required: [role_id]
      properties:
        role_id: { type: string, format: uuid }
        branch_id: { type: [string, 'null'], format: uuid }
        scope: { $ref: '#/components/schemas/OrganizationScope' }
        assigned_at: { type: string, format: date-time }
        assignment_reason: { type: [string, 'null'], maxLength: 500 }
    AssignmentResponse:
      type: object
      properties:
        message: { type: string }
        assignment: { $ref: '#/components/schemas/Assignment' }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    PaginatedBranches:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Branch' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    PaginatedPersonnel:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Personnel' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    Error:
      type: object
      required: [code, message, fields, details, request_id]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, BRANCH_NOT_FOUND, DUPLICATE_BRANCH_CODE, BRANCH_INACTIVE, HEADQUARTERS_BRANCH_PROTECTED, BRANCH_HAS_ACTIVE_ASSIGNMENTS, USER_NOT_ASSIGNABLE, ROLE_SCOPE_NOT_ALLOWED, DUPLICATE_ACTIVE_ASSIGNMENT, INVALID_ORGANIZATION_SCOPE, ORGANIZATION_SCOPE_DENIED, VERSION_CONFLICT, ASSIGNMENT_NOT_FOUND, ASSIGNMENT_ALREADY_CLOSED]
        message: { type: string }
        fields: { type: object }
        details: { type: object }
        request_id: { type: [string, 'null'] }
  responses:
    BranchResponse:
      description: Estado actualizado
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Branch' }
    PersonnelPage:
      description: Página de personal o asignaciones
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedPersonnel' }
    Forbidden:
      description: Permiso o alcance organizacional denegado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicto de estado, unicidad o versión
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Solicitud inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
