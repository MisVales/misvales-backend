openapi: 3.0.3
info:
  title: MisVales API - Módulo 3 (Configuraciones y Catálogos)
  description: |
    API para la gestión centralizada de reglas de negocio, productos, categorías y periodos de canje.
    Implementa Arquitectura Zero-Trust, control de concurrencia optimista y Versionamiento Inmutable.
  version: "1.0.0"
servers:
  - url: /api/v1
    description: Servidor Principal

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  headers:
    XRequestId:
      description: ID de trazabilidad obligatoria.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      description: Llave para prevenir duplicación de operaciones críticas.
      schema:
        type: string
        format: uuid

  schemas:
    BaseError:
      type: object
      properties:
        error:
          type: string
          description: Código de error estable.
        message:
          type: string

    ConfigurationDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        value_type:
          type: string
          enum: [INTEGER, DECIMAL, STRING, BOOLEAN, PERCENTAGE]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    ConfigurationVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        value:
          type: string
          description: El valor real de la configuración (si es decimal, se envía como string)
        status:
          type: string
          enum: [DRAFT, PUBLISHED, INACTIVE]
        effective_from:
          type: string
          format: date-time
          description: Fecha ISO 8601 en UTC (Punto 95)
          example: "2026-08-04T10:00:00Z"
        effective_to:
          type: string
          format: date-time
          description: Fecha ISO 8601 en UTC
          nullable: true

    ProductVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        version:
          type: integer
        name:
          type: string
        nominal_amount:
          type: string
          format: decimal
          description: Múltiplo de 100 representado como decimal string (Punto 94).
          example: "1000.00"
        loan_commission_percentage:
          type: string
          format: decimal
          description: Comisión porcentual como string.
          example: "0.05"
        simple_interest_percentage:
          type: string
          format: decimal
          example: "0.15"
        insurance_amount:
          type: string
          format: decimal
          example: "50.00"
        fortnights_count:
          type: integer
        effective_from:
          type: string
          format: date-time
          description: ISO 8601 con UTC
        effective_to:
          type: string
          format: date-time

    RedemptionPeriod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        point_value:
          type: string
          format: decimal
          description: Valor monetario del punto aplicable (Punto 94).
          example: "1.50"
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CANCELLED, CLOSED]

  responses:
    400BadRequest:
      description: Parámetros inválidos
    401Unauthorized:
      description: Sesión expirada o no iniciada
    403Forbidden:
      description: Permiso denegado por arquitectura Zero-Trust
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseError'
          example:
            error: "AUTH_SCOPE_DENIED"
            message: "No tiene el permiso requerido."
    404NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseError'
          examples:
            ConfigurationNotFound:
              value:
                error: "CONFIGURATION_NOT_FOUND"
            CategoryNotFound:
              value:
                error: "CATEGORY_NOT_FOUND"
            ProductNotFound:
              value:
                error: "PRODUCT_NOT_FOUND"
    409Conflict:
      description: Conflicto de versiones (Optimistic Locking)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseError'
          example:
            error: "RESOURCE_VERSION_CONFLICT"
            message: "Conflicto de concurrencia: El registro fue modificado por otro usuario."
    422UnprocessableEntity:
      description: Regla de negocio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseError'
          examples:
            VersionImmutable:
              value:
                error: "CONFIGURATION_VERSION_IMMUTABLE"
            Overlap:
              value:
                error: "CONFIGURATION_VALIDITY_OVERLAP"
            ProductIncomplete:
              value:
                error: "PRODUCT_INCOMPLETE"

security:
  - bearerAuth: []

paths:
  /configurations:
    post:
      summary: Crear configuración
      description: Requiere permiso `catalogs.manage`.
      parameters:
        - in: header
          name: X-Request-Id
          required: true
          schema:
            $ref: '#/components/headers/XRequestId/schema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                name:
                  type: string
                value_type:
                  type: string
                value:
                  type: string
                effective_from:
                  type: string
                  format: date-time
                reason:
                  type: string
      responses:
        '201':
          description: Configuración y versión creados
        '403':
          $ref: '#/components/responses/403Forbidden'
  
  /configuration-versions/{id}/publish:
    post:
      summary: Publicar versión de configuración
      description: Requiere permiso `catalogs.manage`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            $ref: '#/components/headers/IdempotencyKey/schema'
      responses:
        '200':
          description: Publicación exitosa
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

  /products:
    post:
      summary: Crear nuevo producto base
      description: Requiere permiso `catalogs.manage`.
      parameters:
        - in: header
          name: X-Request-Id
          required: true
          schema:
            $ref: '#/components/headers/XRequestId/schema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Identidad de producto creada

  /products/{id}/versions:
    post:
      summary: Proponer nueva versión de producto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nominal_amount:
                  type: string
                  format: decimal
                loan_commission_percentage:
                  type: string
                  format: decimal
                simple_interest_percentage:
                  type: string
                  format: decimal
                insurance_amount:
                  type: string
                  format: decimal
                fortnights_count:
                  type: integer
                effective_from:
                  type: string
                  format: date-time
                reason:
                  type: string
      responses:
        '201':
          description: Versión DRAFT creada

  /product-versions/{id}/publish:
    post:
      summary: Publicar versión de producto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            $ref: '#/components/headers/IdempotencyKey/schema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lock_version:
                  type: integer
      responses:
        '200':
          description: Versión publicada exitosamente
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

  /redemption-periods/{id}/publish:
    post:
      summary: Publicar periodo de canje
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            $ref: '#/components/headers/IdempotencyKey/schema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lock_version:
                  type: integer
      responses:
        '200':
          description: Periodo publicado exitosamente
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
