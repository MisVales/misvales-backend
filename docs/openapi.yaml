  /api/v1/me/refund-requests:
    get:
      operationId: listOwnRefundRequests
      summary: Lista solicitudes de la distribuidora autenticada
      responses:
        '200': { description: Solicitudes propias paginadas }
        '403': { description: La cuenta no es una distribuidora autorizada }
  /api/v1/me/refund-requests/{id}:
    get:
      operationId: getOwnRefundRequest
      summary: Consulta una solicitud propia
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      responses:
        '200': { description: Detalle de la solicitud propia }
        '404': { description: Fuera de propiedad o inexistente }
  /api/v1/refund-requests:
    get:
      operationId: listScopedRefundRequests
      summary: Lista solicitudes dentro del alcance operativo
      responses:
        '200': { description: Solicitudes paginadas }
        '403': { description: Permiso o alcance insuficiente }
  /api/v1/refund-requests/{id}:
    get:
      operationId: getScopedRefundRequest
      summary: Consulta una solicitud dentro del alcance operativo
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      responses:
        '200': { description: Detalle de la solicitud }
        '404': { description: Fuera de alcance o inexistente }
  /api/v1/refund-requests/{id}/authorize:
    post:
      operationId: authorizeExcessRefund
      summary: Autoriza gerencialmente una devolución sin ejecutarla
      parameters:
        - { $ref: '#/components/parameters/PublicId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/ExcessRefundDecision' }
      responses:
        '200': { description: Devolución autorizada y todavía reservada }
        '403': { description: 'Reautenticación, rol o alcance insuficiente' }
