        '401': { description: Sesión requerida }
  /api/v1/point-redemption-periods:
    get:
      operationId: listPointRedemptionPeriods
      summary: Lista periodos conforme al alcance
      responses:
        '200': { description: Lista paginada }
        '403': { description: Alcance insuficiente }
    post:
      operationId: createPointRedemptionPeriod
      summary: Crea un borrador como gerente general
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, starts_at, ends_at]
              properties:
                name: { type: string, maxLength: 160 }
                description: { type: [string, 'null'], maxLength: 2000 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                reason: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '201': { description: Borrador creado }
        '403': { description: Solo gerente general }
        '422': { description: Vigencia inválida }
  /api/v1/point-redemption-periods/{period}/publish:
    post:
      operationId: publishPointRedemptionPeriod
      summary: Publica un periodo con reautenticación
      parameters:
        - { name: period, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 150 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauthentication_token]
              properties:
                reauthentication_token: { type: string, writeOnly: true, minLength: 64, maxLength: 64 }
                reason: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200': { description: Periodo publicado }
        '403': { description: Autoridad o reautenticación insuficiente }
        '409': { description: Estado o idempotencia en conflicto }
