      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportDefinition' }
    ReportRun:
      type: object
      required: [id, run_number, report_code, contract_version, status, scope, filters, queued_at, correlation_id]
      properties:
        id: { type: string, format: uuid }
        run_number: { type: string }
        report_code: { $ref: '#/components/schemas/ReportCode' }
        contract_version: { type: integer }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, EXPIRED] }
        scope: { type: object }
        filters: { type: object }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
