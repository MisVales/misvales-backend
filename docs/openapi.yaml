        '200': { description: Excedentes paginados }
        '403': { description: Permiso o alcance insuficiente }
  /api/v1/excess-balances/{id}:
    get:
      operationId: getExcessBalance
      summary: Consulta un excedente dentro del alcance administrativo
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      responses:
        '200': { description: Detalle del excedente }
        '404': { description: Fuera de alcance o inexistente }
  /api/v1/excess-balances/{id}/applications:
    get:
      operationId: listExcessApplications
