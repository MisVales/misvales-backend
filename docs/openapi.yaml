openapi: 3.1.0
info:
  title: MisVales API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Servidor actual
security:
  - bearerAuth: []
paths:
  /api/v1/accounts:
    post:
      operationId: createAccount
      summary: Crea una cuenta interna pendiente de activación
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountInput' }
      responses:
        '201': { description: Cuenta e invitación creadas en una transacción }
        '403': { description: Autoridad o autorización operativa inválida }
        '409': { description: Correo ya registrado }
        '422': { description: Datos inválidos }
  /api/v1/account-requests:
    get:
      operationId: listAccountRequests
      summary: Lista solicitudes según el alcance global o de sucursal
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Solicitudes visibles para el actor }
        '403': { description: Actor sin alcance }
    post:
      operationId: createAccountRequest
      summary: Solicita una cuenta de la sucursal del gerente autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchAccountRequestInput' }
      responses:
        '202': { description: Solicitud pendiente de aprobación }
        '403': { description: 'Rol, sucursal o reautorización inválidos' }
        '422': { description: Datos inválidos }
  /api/v1/account-requests/{id}/approve:
    post:
      operationId: approveAccountRequest
      summary: Aprueba de forma idempotente una solicitud
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DecisionInput' } } }
      responses:
        '200': { description: Solicitud aprobada y acción ejecutada una sola vez }
        '403': { description: Gerente general o reautorización inválidos }
        '409': { description: Solicitud ya decidida de otra forma }
  /api/v1/account-requests/{id}/reject:
    post:
      operationId: rejectAccountRequest
      summary: Rechaza una solicitud con motivo
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DecisionInput' } } }
      responses:
        '200': { description: Solicitud rechazada }
        '403': { description: Gerente general o reautorización inválidos }
  /api/v1/accounts/{id}/disable:
    post:
      operationId: disableAccount
      summary: Deshabilita y revoca inmediatamente todo acceso
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      requestBody: { $ref: '#/components/requestBodies/Lifecycle' }
      responses:
        '200': { description: Cuenta deshabilitada y acceso revocado }
        '409': { description: Es el último gerente general activo }
  /api/v1/accounts/{id}/disable-request:
    post:
      operationId: requestAccountDisable
      summary: Solicita deshabilitar una cuenta de la propia sucursal
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PublicId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: '#/components/requestBodies/Lifecycle' }
      responses: { '202': { description: Solicitud pendiente } }
  /api/v1/accounts/{id}/reactivate:
    post:
      operationId: reactivateAccount
      summary: Reactiva sin restaurar tokens y emite una invitación nueva
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      requestBody: { $ref: '#/components/requestBodies/Lifecycle' }
      responses: { '200': { description: Cuenta pendiente de activación } }
  /api/v1/accounts/{id}/reactivate-request:
    post:
      operationId: requestAccountReactivation
      summary: Solicita reactivar una cuenta de la propia sucursal
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PublicId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: '#/components/requestBodies/Lifecycle' }
      responses: { '202': { description: Solicitud pendiente } }
  /api/v1/accounts/{id}/recovery:
    post:
      operationId: initiateAdministrativeRecovery
      summary: Inicia recuperación administrativa de alto riesgo
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      requestBody: { $ref: '#/components/requestBodies/Lifecycle' }
      responses: { '200': { description: Acceso revocado e invitación de recuperación emitida } }
  /api/v1/accounts/{id}/recovery-request:
    post:
      operationId: requestAdministrativeRecovery
      summary: Solicita recuperación para una cuenta de la propia sucursal
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PublicId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: '#/components/requestBodies/Lifecycle' }
      responses: { '202': { description: Solicitud pendiente } }
  /api/v1/accounts/{id}/invitation/resend:
    post:
      operationId: resendAccountInvitation
      summary: Revoca invitaciones anteriores y genera una nueva
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauth_token]
              properties: { reauth_token: { type: string, writeOnly: true } }
      responses: { '200': { description: Invitación reemplazada } }
  /api/v1/auth/invitations/inspect:
    post:
      operationId: inspectAccountInvitation
      summary: Intercambia una invitación por un estado temporal restringido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string, writeOnly: true } }
      responses:
        '200': { description: Estado temporal de activación sin sesión operativa }
        '409': { description: 'Invitación usada, vencida, revocada o de otro propósito' }
  /api/v1/auth/invitations/complete:
    post:
      operationId: completeAccountInvitation
      summary: Establece contraseña propia, registra MFA y activa la cuenta
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteInvitationInput' } } }
      responses:
        '200': { description: Primero devuelve diez códigos una sola vez; tras confirmarlos activa la cuenta y exige login }
        '409': { description: Estado temporal o invitación consumidos }
        '422': { description: Contraseña o inscripción MFA inválidas }
  /api/v1/auth/recovery/password:
    post:
      operationId: requestPasswordRecovery
      summary: Solicita recuperación con respuesta pública constante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses: { '202': { description: Respuesta genérica independiente de la existencia de la cuenta } }
  /api/v1/auth/recovery/password/complete:
    post:
      operationId: completePasswordRecovery
      summary: Cambia la contraseña tras validar un segundo factor
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteRecoveryInput' } } }
      responses:
        '200': { description: Credenciales cambiadas y todo acceso revocado }
        '403': { description: Segundo factor inválido }
        '409': { description: 'Token consumido, vencido o revocado' }
  /api/v1/auth/password/change:
    post:
      operationId: changeOwnPassword
      summary: Cambia la contraseña propia con autorización temporal
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordInput' } } }
      responses:
        '200': { description: Contraseña cambiada; sesiones y tokens revocados }
        '403': { description: Autorización temporal inválida }
        '422': { description: Contraseña fuera de política o reutilizada }
  /api/v1/distributors/{distributor}/credit-line:
    get:
      operationId: getDistributorCreditLine
      summary: Consulta saldos y restricción vigente de la línea
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/DistributorId' }
      responses:
        '200':
          description: Línea visible dentro del alcance del actor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/CreditLine' } }
        '403': { $ref: '#/components/responses/AuthScopeDenied' }
        '404': { $ref: '#/components/responses/CreditLineNotFound' }
  /api/v1/distributors/{distributor}/credit-line/movements:
    get:
      operationId: listDistributorCreditMovements
      summary: Consulta el libro inmutable de movimientos
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/DistributorId' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/CreditMovementType' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: source_type, in: query, schema: { type: string, maxLength: 80 } }
        - { name: source_id, in: query, schema: { type: string, maxLength: 128 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Página de movimientos visibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CreditMovement' } }
                  meta: { type: object }
                  links: { type: object }
        '403': { $ref: '#/components/responses/AuthScopeDenied' }
        '404': { $ref: '#/components/responses/CreditLineNotFound' }
  /api/v1/distributors/{distributor}/credit-increase-requests:
    post:
      operationId: createCreditIncreaseRequest
      summary: Registra de forma idempotente una solicitud propia
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/DistributorId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCreditIncreaseInput' }
            examples:
              normal:
                value:
                  requested_amount: '10000.00'
                  reason: Incremento solicitado para continuar operaciones
              insufficientCredit:
                value:
                  requested_amount: '5000.00'
                  reason: El producto seleccionado supera el saldo disponible
                  origin: { type: INSUFFICIENT_CREDIT, product_amount: '15000.00' }
      responses:
        '201':
          description: Solicitud registrada o resultado idempotente existente
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/CreditIncreaseRequest' } } }
        '403': { $ref: '#/components/responses/AuthScopeDenied' }
        '404': { $ref: '#/components/responses/CreditLineNotFound' }
        '422': { description: 'Importe, motivo u origen inválido' }
  /api/v1/credit-increase-requests:
    get:
      operationId: listCreditIncreaseRequests
      summary: Lista solicitudes limitadas siempre por el alcance del actor
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CreditIncreaseStatus' } }
        - { name: branch_id, in: query, schema: { type: integer } }
        - { name: coordinator_id, in: query, schema: { type: integer } }
        - { name: distributor_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Página de solicitudes dentro del alcance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CreditIncreaseRequest' } }
                  meta: { type: object }
                  links: { type: object }
        '403': { $ref: '#/components/responses/AuthScopeDenied' }
  /api/v1/credit-increase-requests/{creditIncreaseRequest}:
    get:
      operationId: getCreditIncreaseRequest
      summary: Consulta el detalle de una solicitud visible
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CreditIncreaseRequestId' }
      responses:
        '200':
          description: Detalle de la solicitud
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/CreditIncreaseRequest' } } }
        '403': { $ref: '#/components/responses/AuthScopeDenied' }
        '404': { description: Solicitud inexistente }
  /api/v1/credit-increase-requests/{creditIncreaseRequest}/preauthorize:
    post:
      operationId: reviewCreditIncreaseRequest
      summary: Preautoriza o rechaza como coordinador responsable
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CreditIncreaseRequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoordinatorCreditDecisionInput' }
            examples:
              preauthorize:
                value: { decision: PREAUTHORIZE, recommended_amount: '8000.00', reason: Historial y comportamiento revisados, lock_version: 1 }
              reject:
                value: { decision: REJECT, reason: La solicitud no fue preautorizada, lock_version: 1 }
      responses:
        '200': { description: Solicitud revisada }
        '403': { $ref: '#/components/responses/AuthScopeDenied' }
        '409': { description: Estado o versión incompatible }
        '422': { description: Decisión o importe inválido }
  /api/v1/credit-increase-requests/{creditIncreaseRequest}/manager-decision:
    post:
      operationId: decideCreditIncreaseRequest
      summary: Autoriza total/parcialmente o rechaza con reautenticación M01
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CreditIncreaseRequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerCreditDecisionInput' }
            examples:
              full:
                value: { decision: AUTHORIZE, authorized_amount: '10000.00', reason: Incremento autorizado, reauthentication_id: token-de-reautenticacion, lock_version: 2 }
              partial:
                value: { decision: AUTHORIZE, authorized_amount: '7000.00', reason: Se autoriza un importe menor, reauthentication_id: token-de-reautenticacion, lock_version: 2 }
              reject:
                value: { decision: REJECT, reason: Incremento no autorizado, reauthentication_id: token-de-reautenticacion, lock_version: 2 }
      responses:
        '200': { description: Decisión aplicada idempotentemente }
        '403':
          description: Alcance denegado o reautenticación inválida
        '409': { description: 'Estado, solicitud o versión de línea incompatible' }
        '422': { description: Importe mayor al solicitado o decisión inválida }
  /api/v1/distributor-applications:
    get:
      operationId: listDistributorApplications
      summary: Lista solicitudes dentro del alcance efectivo
      x-permission: onboarding applications view assigned, branch or global
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: folio
          in: query
          schema: { type: string, maxLength: 40 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DistributorApplicationStatus' }
        - name: result
          in: query
          schema:
            type: string
            enum: [TERMINATED_UNFAVORABLE, REJECTED, ACTIVE]
        - name: branch_id
          in: query
          description: Solo reduce el conjunto previamente autorizado.
          schema: { type: string, format: uuid }
        - name: coordinator_id
          in: query
          description: Solo reduce el conjunto previamente autorizado.
          schema: { type: string, format: uuid }
        - name: verifier_id
          in: query
          description: Solo reduce el conjunto previamente autorizado.
          schema: { type: string, format: uuid }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de solicitudes con datos sensibles omitidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
    post:
      operationId: createDistributorApplication
      summary: Crea una solicitud en CAPTURE
      x-permission: onboarding.applications.create
      description: La sucursal, el coordinador, el folio y el estado se resuelven en backend. El permiso no se asigna a ningún rol hasta que se apruebe la autoridad de captura.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Solicitud creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: showDistributorApplication
      summary: Consulta el detalle permitido
      x-scope: global, branch, responsible coordinator or assigned verifier
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Detalle autorizado; el administrador recibe enmascaramiento adicional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
    patch:
      operationId: updateDistributorApplicationCapture
      summary: Edita contacto y datos personales en CAPTURE
      x-permission: onboarding.applications.update_capture
      x-required-status: CAPTURE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaptureRequest'
      responses:
        '200':
          description: Versión actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/submit:
    post:
      operationId: submitDistributorApplication
      summary: Envía una versión completa a revisión
      x-permission: onboarding.applications.submit
      x-required-status: CAPTURE
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        $ref: '#/components/requestBodies/VersionedAction'
      responses:
        '200':
          description: Solicitud en COORDINATOR_REVIEW.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/history:
    get:
      operationId: showDistributorApplicationHistory
      summary: Consulta historial permitido
      x-permission: onboarding.history.view
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Auditoría funcional ordenada que reconstruye el expediente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationHistoryResponse'
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/request-document-correction:
    post:
      operationId: requestDistributorDocumentCorrection
      summary: Devuelve la solicitud a CAPTURE con motivo
      x-permission: onboarding.applications.review
      x-required-status: COORDINATOR_REVIEW
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        $ref: '#/components/requestBodies/ReasonAction'
      responses:
        '200': { description: Solicitud devuelta sin borrar entregas anteriores. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/assign-verifier:
    post:
      operationId: assignDistributorApplicationVerifier
      summary: Asigna un verificador vigente
      x-permission: onboarding.verifications.assign
      x-required-status: COORDINATOR_REVIEW
      description: El permiso no se asigna a ningún rol hasta que se apruebe la autoridad responsable.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignVerifierRequest'
      responses:
        '200': { description: Solicitud en VISIT_ASSIGNED. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/visits:
    post:
      operationId: startDistributorVerificationVisit
      summary: Inicia la única visita de la asignación vigente
      x-permission: onboarding.verifications.perform
      x-required-status: VISIT_ASSIGNED
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        $ref: '#/components/requestBodies/VersionedAction'
      responses:
        '201': { description: Visita iniciada. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/visits/{visitId}:
    get:
      operationId: showDistributorVerificationVisit
      summary: Consulta una visita autorizada
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/VisitId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200': { description: Visita dentro del alcance. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/visits/{visitId}/differences:
    post:
      operationId: recordDistributorVerificationDifference
      summary: Registra una diferencia sin corregir el expediente
      x-permission: onboarding.verifications.perform
      x-required-status: PHYSICAL_VERIFICATION
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/VisitId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDifferenceRequest'
      responses:
        '201': { description: Diferencia inmutable registrada. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/visits/{visitId}/complete:
    post:
      operationId: completeDistributorVerificationVisit
      summary: Finaliza la visita una sola vez
      x-permission: onboarding.verifications.perform
      x-required-status: PHYSICAL_VERIFICATION
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/VisitId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteVisitRequest'
      responses:
        '200': { description: Resultado final aplicado. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/corrections:
    post:
      operationId: recordDistributorApplicationCorrection
      summary: Registra una corrección inmutable del coordinador
      x-permission: onboarding.applications.correct
      x-required-status: COORDINATOR_CORRECTION
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCorrectionRequest'
      responses:
        '200': { description: Corrección aplicada conservando el valor original. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/corrections/complete:
    post:
      operationId: completeDistributorApplicationCorrections
      summary: Pasa a evaluación sin crear otra visita
      x-permission: onboarding.applications.correct
      x-required-status: COORDINATOR_CORRECTION
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        $ref: '#/components/requestBodies/VersionedAction'
      responses:
        '200': { description: Solicitud en COORDINATOR_EVALUATION. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/coordinator-decision:
    post:
      operationId: decideDistributorApplicationAsCoordinator
      summary: Registra una única evaluación del coordinador
      x-permission: onboarding.applications.evaluate
      x-required-status: COORDINATOR_EVALUATION
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoordinatorDecisionRequest'
      responses:
        '200': { description: Evaluación registrada. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/manager-decision:
    post:
      operationId: decideDistributorApplicationAsManager
      summary: Rechaza o autoriza y aprovisiona
      x-permission: onboarding applications authorize branch or global
      x-required-status: MANAGER_AUTHORIZATION
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerDecisionRequest'
      responses:
        '200': { description: Rechazo definitivo o activación completa. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/distributor-applications/{id}/activation:
    get:
      operationId: showDistributorApplicationActivation
      summary: Consulta el resultado permitido de activación
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200': { description: Resultado de activación o null. }
        '4XX':
          $ref: '#/components/responses/OnboardingError'
        default:
          $ref: '#/components/responses/OnboardingError'
  /api/v1/clients:
    get:
      operationId: listClients
      summary: Lista clientes dentro del alcance efectivo
      x-permission: clients.view.global, clients.view.branch or clients.view.assigned
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - { name: name, in: query, schema: { type: string, maxLength: 200 } }
        - { name: curp, in: query, description: Búsqueda exacta protegida, schema: { type: string, maxLength: 30 } }
        - { name: distributor_id, in: query, schema: { type: string, format: uuid } }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: registered_from, in: query, schema: { type: string, format: date } }
        - { name: registered_to, in: query, schema: { type: string, format: date } }
        - { name: portfolio_tracking_enabled, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [name, registered_at] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Página de clientes con PII enmascarada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        default: { $ref: '#/components/responses/ClientError' }
    post:
      operationId: registerClient
      summary: Registra un cliente para la distribuidora autenticada
      x-permission: clients.create.own
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterClientRequest' }
      responses:
        '201':
          description: Cliente creado atómicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistrationResponse' }
        '200':
          description: Repetición idempotente exacta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistrationResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        default: { $ref: '#/components/responses/ClientError' }
  /api/v1/clients/{client}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      operationId: getClient
      summary: Consulta un cliente visible para la cuenta
      responses:
        '200':
          description: Recurso separado según la audiencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetailResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        default: { $ref: '#/components/responses/ClientError' }
  /api/v1/clients/{client}/bank-accounts:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      operationId: listClientBankAccounts
      summary: Lista versiones bancarias siempre enmascaradas
      responses:
        '200':
          description: Historial bancario enmascarado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClientBankAccountMasked' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        default: { $ref: '#/components/responses/ClientError' }
    post:
      operationId: replaceClientBankAccountWithAuthorization
      summary: Crea una versión bancaria mediante autorización M09
      x-permission: clients.apply_authorized_change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizedBankAccountRequest' }
      responses:
        '200':
          description: Nueva versión bancaria enmascarada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ClientBankAccountMasked' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        default: { $ref: '#/components/responses/ClientError' }
  /api/v1/clients/{client}/portfolio-entries:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      operationId: listClientPortfolioEntries
      summary: Lista cartera informativa propia
      x-permission: clients.portfolio.view.own
      responses:
        '200':
          description: Página de movimientos informativos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPortfolioListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        default: { $ref: '#/components/responses/ClientError' }
    post:
      operationId: recordClientPortfolioEntry
      summary: Registra pago, abono, estado o nota informativa
      x-permission: clients.portfolio.write.own
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientPortfolioEntryRequest' }
      responses:
        '201':
          description: Entrada informativa registrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ClientPortfolioEntry' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        default: { $ref: '#/components/responses/ClientError' }
  /api/v1/clients/{client}/portfolio-entries/{entry}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: '#/components/parameters/XRequestId'
    patch:
      operationId: correctClientPortfolioEntry
      summary: Corrige únicamente estado y nota con versión esperada
      x-permission: clients.portfolio.write.own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientPortfolioEntryPatch' }
      responses:
        '200':
          description: Entrada corregida con historial.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ClientPortfolioEntry' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        default: { $ref: '#/components/responses/ClientError' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    PublicId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DistributorId:
      name: distributor
      in: path
      required: true
      schema: { type: string, format: uuid }
    CreditIncreaseRequestId:
      name: creditIncreaseRequest
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 160 }
    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientId:
      name: client
      in: path
      required: true
      schema: { type: string, format: uuid }
    VisitId:
      name: visitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión entera leída por el cliente; lock_version puede enviarse en el cuerpo.
      schema: { type: string }
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
  responses:
    AuthScopeDenied:
      description: Actor sin rol, sucursal, asignación o propiedad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }
    CreditLineNotFound:
      description: No existe una línea para la distribuidora
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }
    OnboardingError:
      description: Error de validación, alcance, estado, versión o integración.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientError:
      description: Error uniforme de autenticación, alcance, validación, duplicidad, versión o dependencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  requestBodies:
    Lifecycle:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LifecycleInput' }
    VersionedAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionedActionRequest'
    ReasonAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReasonActionRequest'
  schemas:
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '20000.00'
      description: Importe decimal serializado como cadena
    CreditMovementType:
      type: string
      enum: [INITIAL_AUTHORIZATION, INCREASE, VOUCHER_FULFILLED, CAPITAL_RECOVERED, AUTHORIZED_CORRECTION]
    CreditIncreaseStatus:
      type: string
      enum: [SOLICITADO, PREAUTORIZADO, RECHAZADO_COORDINADOR, RECHAZADO_GERENTE, AUTORIZADO_TOTAL, AUTORIZADO_PARCIAL, RESTRICCION_50_ACTIVA, COMPLETADO]
    CreditRestriction:
      type: object
      required: [id, status, trigger_type, reference_amount, tolerance_amount, lower_limit, upper_limit, has_admissible_amount]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, BOUND, CONSUMED] }
        trigger_type: { type: string, enum: [INITIAL_AUTHORIZATION, INCREASE] }
        reference_amount: { $ref: '#/components/schemas/Money' }
        tolerance_amount: { $ref: '#/components/schemas/Money' }
        lower_limit: { $ref: '#/components/schemas/Money' }
        upper_limit: { $ref: '#/components/schemas/Money' }
        has_admissible_amount: { type: boolean }
        bound_voucher_id: { type: [string, 'null'] }
    CreditLine:
      type: object
      required: [id, distributor_id, total_authorized, used_balance, available_balance, recovered_capital_total, lock_version]
      properties:
        id: { type: string, format: uuid }
        distributor_id: { type: string, format: uuid }
        total_authorized: { $ref: '#/components/schemas/Money' }
        used_balance: { $ref: '#/components/schemas/Money' }
        available_balance: { $ref: '#/components/schemas/Money' }
        recovered_capital_total: { $ref: '#/components/schemas/Money' }
        lock_version: { type: integer }
        last_movement_at: { type: [string, 'null'], format: date-time }
        restriction:
          oneOf:
            - { $ref: '#/components/schemas/CreditRestriction' }
            - { type: 'null' }
    CreditMovement:
      type: object
      required: [id, type, total_delta, used_delta, total_before, total_after, used_before, used_after, available_before, available_after, source, reason, occurred_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/CreditMovementType' }
        total_delta: { type: string }
        used_delta: { type: string }
        total_before: { $ref: '#/components/schemas/Money' }
        total_after: { $ref: '#/components/schemas/Money' }
        used_before: { $ref: '#/components/schemas/Money' }
        used_after: { $ref: '#/components/schemas/Money' }
        available_before: { $ref: '#/components/schemas/Money' }
        available_after: { $ref: '#/components/schemas/Money' }
        source:
          type: object
          required: [type, id]
          properties: { type: { type: string }, id: { type: string } }
        reason: { type: string }
        configuration_snapshot: { type: [object, 'null'] }
        occurred_at: { type: string, format: date-time }
    CreateCreditIncreaseInput:
      type: object
      required: [requested_amount, reason]
      properties:
        requested_amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 5, maxLength: 2000 }
        origin:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [NORMAL, INSUFFICIENT_CREDIT] }
            product_amount: { $ref: '#/components/schemas/Money' }
    CoordinatorCreditDecisionInput:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [PREAUTHORIZE, REJECT] }
        recommended_amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 5, maxLength: 2000 }
        lock_version: { type: integer, minimum: 1 }
    ManagerCreditDecisionInput:
      type: object
      required: [decision, reason, reauthentication_id]
      properties:
        decision: { type: string, enum: [AUTHORIZE, REJECT] }
        authorized_amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 5, maxLength: 2000 }
        reauthentication_id: { type: string, writeOnly: true }
        lock_version: { type: integer, minimum: 1 }
    CreditIncreaseRequest:
      type: object
      required: [id, folio, distributor_id, requested_amount, status, origin, line_snapshot, reasons, actors, requested_at, lock_version]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        distributor_id: { oneOf: [{ type: string, format: uuid }, { type: integer }] }
        branch_id: { type: integer }
        coordinator_id: { type: integer }
        requested_amount: { $ref: '#/components/schemas/Money' }
        recommended_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        authorized_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        origin: { type: object }
        line_snapshot: { type: object }
        status: { $ref: '#/components/schemas/CreditIncreaseStatus' }
        reasons: { type: object }
        actors: { type: object }
        requested_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        restriction_id: { type: [string, integer, 'null'] }
        lock_version: { type: integer }
    DomainError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              enum: [AUTH_SCOPE_DENIED, REAUTHENTICATION_REQUIRED, RESOURCE_VERSION_CONFLICT, CREDIT_LINE_ALREADY_EXISTS, CREDIT_LINE_NOT_FOUND, CREDIT_INVALID_BALANCE, CREDIT_INSUFFICIENT, CREDIT_50_PERCENT_RULE_NOT_SATISFIED, CREDIT_50_PERCENT_NO_ADMISSIBLE_AMOUNT, CREDIT_RESTRICTION_ALREADY_BOUND, CREDIT_RESTRICTION_NOT_ACTIVE, CREDIT_RESTRICTION_VOUCHER_MISMATCH, CREDIT_INCREASE_INVALID_STATE, CREDIT_INCREASE_AMOUNT_INVALID, CREDIT_INCREASE_NOT_PREAUTHORIZED, CREDIT_INCREASE_EXCEEDS_REQUESTED, CREDIT_MOVEMENT_DUPLICATE, CAPITAL_RECOVERY_EXCEEDS_USED_BALANCE]
            message: { type: string }
            correlationId: { type: string, format: uuid }
    PasswordWithConfirmation:
      type: object
      required: [password, password_confirmation]
      properties:
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        password_confirmation: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    CompleteInvitationInput:
      type: object
      required: [exchange_token]
      properties:
        exchange_token: { type: string, writeOnly: true }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        password_confirmation: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        recovery_codes_confirmed: { type: boolean, description: Segunda fase; confirma que los códigos mostrados fueron guardados }
        mfa:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [PASSKEY, TOTP] }
            secret: { type: string, writeOnly: true }
            code: { type: string, pattern: '^\d{6}$', writeOnly: true }
            credential_identifier: { type: string }
            public_key: { type: string, writeOnly: true }
            attestation_token: { type: string, writeOnly: true }
      anyOf:
        - { required: [password, password_confirmation, mfa] }
        - properties: { recovery_codes_confirmed: { const: true } }
          required: [recovery_codes_confirmed]
    CompleteRecoveryInput:
      allOf:
        - { $ref: '#/components/schemas/PasswordWithConfirmation' }
        - type: object
          required: [token]
          properties:
            token: { type: string, writeOnly: true }
            factor_type: { type: string, enum: [TOTP, RECOVERY_CODE, PASSKEY_AUTHORIZATION] }
            factor_value: { type: string, writeOnly: true }
            mfa: { type: object, description: Requerido para recuperación administrativa }
    ChangePasswordInput:
      allOf:
        - { $ref: '#/components/schemas/PasswordWithConfirmation' }
        - type: object
          required: [reauth_token]
          properties: { reauth_token: { type: string, writeOnly: true } }
    CreateAccountInput:
      type: object
      required: [name, email, role, authorization_token]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/RoleCode' }
        branch_id: { type: [string, 'null'], format: uuid }
        authorization_token: { type: string, writeOnly: true }
    BranchAccountRequestInput:
      type: object
      required: [name, email, role, reason, reauth_token]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [COORDINATOR, VERIFIER, CASHIER] }
        reason: { type: string }
        reauth_token: { type: string, writeOnly: true }
    DecisionInput:
      type: object
      required: [reason, reauth_token]
      properties:
        reason: { type: string }
        reauth_token: { type: string, writeOnly: true }
    LifecycleInput:
      type: object
      required: [reason, reauth_token]
      properties:
        reason: { type: string }
        reauth_token: { type: string, writeOnly: true }
        compromise: { type: boolean, default: false }
    RoleCode:
      type: string
      enum:
        - GENERAL_MANAGER
        - SUCURSAL_MANAGER
        - COORDINATOR
        - VERIFIER
        - ADMINISTRATOR
        - DISTRIBUTOR
        - CASHIER
    PermissionCode:
      type: string
      enum:
        - auth.context.read
        - auth.sessions.read_own
        - auth.sessions.revoke_own
        - auth.password.change_own
        - auth.mfa.manage_own
        - accounts.global.create
        - accounts.branch.request
        - accounts.global.approve
        - accounts.global.disable
        - accounts.branch.disable_request
        - security.alerts.global.read
        - security.alerts.branch.read
        - security.audit.global.read
        - onboarding.applications.create
        - onboarding.applications.update_capture
        - onboarding.applications.submit
        - onboarding.applications.view_assigned
        - onboarding.applications.view_branch
        - onboarding.applications.view_global
        - onboarding.applications.review
        - onboarding.verifications.assign
        - onboarding.verifications.perform
        - onboarding.applications.correct
        - onboarding.applications.evaluate
        - onboarding.applications.authorize_branch
        - onboarding.applications.authorize_global
        - onboarding.evidence.view
        - onboarding.history.view
        - clients.view.global
        - clients.view.branch
        - clients.view.assigned
        - clients.create.own
        - clients.view_sensitive.authorized
        - clients.view_documents.authorized
        - clients.apply_authorized_change
        - clients.portfolio.view.own
        - clients.portfolio.write.own
        - clients.assignment.apply_internal
    AccountState:
      type: string
      enum:
        - PENDING_ACTIVATION
        - ACTIVE
        - SECURITY_SUSPENDED
        - DISABLED
    AccountRequestState:
      type: string
      enum:
        - PENDING_APPROVAL
        - APPROVED
        - REJECTED
        - CANCELLED
    TokenState:
      type: string
      enum:
        - ACTIVE
        - USED
        - REPLACED
        - EXPIRED
        - REVOKED

    DistributorApplicationStatus:
      type: string
      enum:
        - CAPTURE
        - COORDINATOR_REVIEW
        - VISIT_ASSIGNED
        - PHYSICAL_VERIFICATION
        - COORDINATOR_CORRECTION
        - COORDINATOR_EVALUATION
        - TERMINATED_UNFAVORABLE
        - MANAGER_AUTHORIZATION
        - REJECTED
        - ACTIVE
    ApplicationSummary:
      type: object
      required: [id, folio, status, branch, coordinator, allowed_actions, lock_version]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        status: { $ref: '#/components/schemas/DistributorApplicationStatus' }
        result:
          type: [string, 'null']
          enum: [TERMINATED_UNFAVORABLE, REJECTED, ACTIVE, null]
        branch:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        coordinator:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        verifier:
          type: [object, 'null']
        allowed_actions:
          type: array
          items: { type: string }
        lock_version: { type: integer, minimum: 1 }
    ApplicationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ApplicationDetail' }
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
    ApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          required: [contact_email, account_name, visit, differences, corrections, evaluation, authorization, activation]
          properties:
            contact_email: { type: string, format: email }
            account_name: { type: string }
            personal_data:
              type: object
              additionalProperties: false
              properties:
                first_name: { type: [string, 'null'] }
                paternal_surname: { type: [string, 'null'] }
                maternal_surname: { type: [string, 'null'] }
                curp: { type: [string, 'null'] }
                rfc: { type: [string, 'null'] }
                birth_date: { type: [string, 'null'], format: date }
                birth_place: { type: [string, 'null'] }
                birth_state: { type: [string, 'null'] }
                birth_city: { type: [string, 'null'] }
                declared_address: { type: [string, 'null'] }
                official_identification_media_id: { type: [string, 'null'], format: uuid }
            family_members: { type: array, items: { type: object } }
            family_references: { type: array, items: { type: object } }
            residences: { type: array, items: { type: object } }
            vehicles: { type: array, items: { type: object } }
            assets_liabilities: { type: array, items: { type: object } }
            employments: { type: array, items: { type: object } }
            labor_references: { type: array, items: { type: object } }
            commercial_credits: { type: array, items: { type: object } }
            expedient_counts: { type: object, description: Vista enmascarada para administración. }
            visit:
              type: [object, 'null']
              properties:
                id: { type: string, format: uuid }
                started_at: { type: string, format: date-time }
                completed_at: { type: [string, 'null'], format: date-time }
                result: { type: [string, 'null'], enum: [FAVORABLE, UNFAVORABLE, CORRECTABLE_DIFFERENCES, null] }
                observations: { type: [string, 'null'] }
                lock_version: { type: integer, minimum: 1 }
            differences:
              type: array
              items: { $ref: '#/components/schemas/VerificationDifference' }
            corrections:
              type: array
              items: { $ref: '#/components/schemas/ApplicationCorrection' }
            evaluation: { type: [object, 'null'] }
            authorization: { type: [object, 'null'] }
            activation: { type: [object, 'null'] }
    VerificationDifference:
      type: object
      required: [id, section, field_path, declared_value, observed_value, description, classification_code, recorded_at]
      properties:
        id: { type: string, format: uuid }
        section: { type: string }
        field_path: { type: string }
        declared_value: { type: string }
        observed_value: { type: string }
        description: { type: string }
        classification_code: { type: string }
        evidence_media_id: { type: [string, 'null'], format: uuid }
        recorded_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
    ApplicationCorrection:
      type: object
      required: [id, section, field_path, original_value, corrected_value, reason, corrected_at]
      properties:
        id: { type: string, format: uuid }
        difference_id: { type: [string, 'null'], format: uuid }
        section: { type: string }
        field_path: { type: string }
        original_value: { type: [string, 'null'], description: Enmascarado según el perfil. }
        corrected_value: { type: [string, 'null'], description: Enmascarado según el perfil. }
        reason: { type: string }
        corrected_by: { type: [object, 'null'] }
        corrected_at: { type: string, format: date-time }
    ApplicationHistoryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, action, actor, entity, application_version, occurred_at]
            properties:
              id: { type: string, format: uuid }
              action: { type: string }
              previous_status: { type: [string, 'null'] }
              new_status: { type: [string, 'null'] }
              actor: { type: [object, 'null'] }
              entity:
                type: object
                required: [type]
                properties:
                  type: { type: string }
                  id: { type: [string, 'null'], format: uuid }
              reason: { type: [string, 'null'] }
              result: { type: [string, 'null'] }
              application_version: { type: integer, minimum: 1 }
              occurred_at: { type: string, format: date-time }
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
    ApplicationListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ApplicationSummary' }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
            request_id: { type: string, format: uuid }
    CreateApplicationRequest:
      type: object
      required: [contact_email, account_name]
      additionalProperties: false
      properties:
        contact_email: { type: string, format: email, maxLength: 254 }
        account_name: { type: string, maxLength: 255 }
    UpdateCaptureRequest:
      type: object
      required: [lock_version]
      additionalProperties: false
      anyOf:
        - required: [contact_email]
        - required: [account_name]
        - required: [personal_data]
      properties:
        lock_version: { type: integer, minimum: 1 }
        contact_email: { type: string, format: email, maxLength: 254 }
        account_name: { type: string, maxLength: 255 }
        personal_data:
          type: object
          additionalProperties: false
          properties:
            first_name: { type: string, maxLength: 150 }
            paternal_surname: { type: string, maxLength: 150 }
            maternal_surname: { type: [string, 'null'], maxLength: 150 }
            curp: { type: [string, 'null'], maxLength: 18 }
            rfc: { type: [string, 'null'], maxLength: 13 }
            birth_date: { type: [string, 'null'], format: date }
            birth_place: { type: [string, 'null'] }
            birth_state: { type: [string, 'null'] }
            birth_city: { type: [string, 'null'] }
            declared_address: { type: [string, 'null'] }
            official_identification_media_id: { type: [string, 'null'], format: uuid }
    VersionedActionRequest:
      type: object
      required: [lock_version]
      additionalProperties: false
      properties:
        lock_version: { type: integer, minimum: 1 }
    ReasonActionRequest:
      allOf:
        - $ref: '#/components/schemas/VersionedActionRequest'
        - type: object
          required: [reason]
          properties:
            reason: { type: string, maxLength: 4000 }
    AssignVerifierRequest:
      allOf:
        - $ref: '#/components/schemas/VersionedActionRequest'
        - type: object
          required: [verifier_id]
          properties:
            verifier_id: { type: string, format: uuid }
    RecordDifferenceRequest:
      allOf:
        - $ref: '#/components/schemas/VersionedActionRequest'
        - type: object
          required: [section, field_path, declared_value, observed_value, description, classification_code]
          properties:
            section:
              type: string
              enum: [CONTACT, PERSONAL, FAMILY_MEMBER, FAMILY_REFERENCE, RESIDENCE, VEHICLE, ASSET_LIABILITY, EMPLOYMENT, LABOR_REFERENCE, COMMERCIAL_CREDIT]
            field_path: { type: string, maxLength: 255 }
            declared_value: { type: string, maxLength: 8000 }
            observed_value: { type: string, maxLength: 8000 }
            description: { type: string, maxLength: 4000 }
            classification_code: { type: string, maxLength: 80 }
            evidence_media_id: { type: [string, 'null'], format: uuid }
    CompleteVisitRequest:
      allOf:
        - $ref: '#/components/schemas/VersionedActionRequest'
        - type: object
          required: [result, observations]
          properties:
            result:
              type: string
              enum: [FAVORABLE, UNFAVORABLE, CORRECTABLE_DIFFERENCES]
            observations: { type: string, maxLength: 4000 }
    RecordCorrectionRequest:
      allOf:
        - $ref: '#/components/schemas/VersionedActionRequest'
        - type: object
          required: [section, field_path, expected_original_value, corrected_value, reason]
          properties:
            section: { type: string }
            field_path: { type: string, maxLength: 255 }
            expected_original_value: { type: string, maxLength: 8000 }
            corrected_value: { type: string, maxLength: 8000 }
            reason: { type: string, maxLength: 4000 }
            difference_id: { type: [string, 'null'], format: uuid }
    CoordinatorDecisionRequest:
      allOf:
        - $ref: '#/components/schemas/ReasonActionRequest'
        - type: object
          required: [decision]
          properties:
            decision:
              type: string
              enum: [MEETS_REQUIREMENTS, DOES_NOT_MEET_REQUIREMENTS]
    ManagerDecisionRequest:
      allOf:
        - $ref: '#/components/schemas/ReasonActionRequest'
        - type: object
          required: [decision]
          properties:
            decision:
              type: string
              enum: [APPROVE, REJECT]
            initial_credit_line:
              type: [string, 'null']
              pattern: '^(0|[1-9]\d{0,14})(\.\d{1,4})?$'
              example: '15000.0000'
            reauthentication_token:
              type: [string, 'null']
              writeOnly: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields, details, request_id]
          properties:
            code:
              type: string
              example: APPLICATION_STATE_INVALID
            message: { type: string }
            fields: { type: object }
            details: { type: object }
            request_id: { type: string, format: uuid }
    ClientAddressInput:
      type: object
      additionalProperties: false
      required: [street, exterior_number, neighborhood, postal_code, municipality, city, state]
      properties:
        street: { type: string, maxLength: 200 }
        exterior_number: { type: string, maxLength: 40 }
        interior_number: { type: [string, 'null'], maxLength: 40 }
        neighborhood: { type: string, maxLength: 160 }
        postal_code: { type: string, maxLength: 20 }
        municipality: { type: string, maxLength: 160 }
        city: { type: string, maxLength: 160 }
        state: { type: string, maxLength: 120 }
    RegisterClientRequest:
      type: object
      additionalProperties: false
      required:
        - given_names
        - surnames
        - curp
        - address
        - official_identification_media_id
        - address_proof_media_id
        - bank_account
      properties:
        given_names: { type: string, maxLength: 160 }
        surnames: { type: string, maxLength: 200 }
        curp: { type: string, maxLength: 30, writeOnly: true }
        rfc: { type: [string, 'null'], maxLength: 30, writeOnly: true }
        birth_date: { type: [string, 'null'], format: date }
        birth_place: { type: [string, 'null'], maxLength: 200 }
        birth_state: { type: [string, 'null'], maxLength: 120 }
        birth_city: { type: [string, 'null'], maxLength: 160 }
        address: { $ref: '#/components/schemas/ClientAddressInput' }
        official_identification_media_id: { type: string, format: uuid }
        address_proof_media_id: { type: string, format: uuid }
        bank_account: { type: string, maxLength: 160, writeOnly: true }
    ClientListItem:
      type: object
      required: [id, display_name, curp_masked, portfolio_tracking_enabled, registered_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        curp_masked: { type: string }
        distributor_id: { type: [string, 'null'], format: uuid }
        branch:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        portfolio_tracking_enabled: { type: boolean }
        registered_at: { type: string, format: date-time }
    ClientListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ClientListItem' }
        links: { type: object }
        meta: { type: object }
    ClientRegistrationResponse:
      type: object
      properties:
        data:
          type: object
          required: [id, display_name, curp_masked, distributor, branch, registered_at]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            curp_masked: { type: string }
            distributor:
              type: object
              properties:
                id: { type: string, format: uuid }
                number: { type: string }
            branch:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            registered_at: { type: string, format: date-time }
            existing_for_future_vouchers: { type: boolean, const: true }
            replayed: { type: boolean }
    ClientDetailResponse:
      type: object
      description: La forma exacta depende de la audiencia; nunca contiene cifrado, HMAC ni cuenta completa.
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/ClientListItem'
            - type: object
              properties:
                address: { type: [object, 'null'] }
                bank_account: { type: [string, 'null'] }
                documents:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      type: { type: string, enum: [OFFICIAL_IDENTIFICATION, ADDRESS_PROOF] }
                      private_reference: { type: string, format: uuid }
                lock_version: { type: integer, minimum: 1 }
    ClientBankAccountMasked:
      type: object
      required: [id, account_masked, effective_from, is_current]
      properties:
        id: { type: string, format: uuid }
        account_masked: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, 'null'], format: date-time }
        is_current: { type: boolean }
    AuthorizedBankAccountRequest:
      type: object
      additionalProperties: false
      required: [authorization_id, operation_id, bank_account, reason, lock_version]
      properties:
        authorization_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        bank_account: { type: string, maxLength: 160, writeOnly: true }
        reason: { type: string, maxLength: 1000 }
        lock_version: { type: integer, minimum: 1 }
    ClientPortfolioEntry:
      type: object
      required: [id, entry_type, informational_status, occurred_on, lock_version]
      properties:
        id: { type: string, format: uuid }
        entry_type: { type: string, enum: [VOUCHER, PAYMENT, INSTALLMENT, STATUS_UPDATE, NOTE] }
        amount: { type: [string, 'null'], pattern: '^\d+\.\d{2}$' }
        informational_status: { type: string, enum: [PENDING, PARTIAL, PAID] }
        occurred_on: { type: string, format: date }
        note: { type: [string, 'null'], maxLength: 1000 }
        lock_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    ClientPortfolioListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ClientPortfolioEntry' }
        links: { type: object }
        meta: { type: object }
    ClientPortfolioEntryRequest:
      type: object
      additionalProperties: false
      required: [entry_type, informational_status, occurred_on]
      properties:
        entry_type: { type: string, enum: [PAYMENT, INSTALLMENT, STATUS_UPDATE, NOTE] }
        amount: { type: [string, 'null'], pattern: '^\d{1,15}(\.\d{1,4})?$' }
        informational_status: { type: string, enum: [PENDING, PARTIAL, PAID] }
        occurred_on: { type: string, format: date }
        note: { type: [string, 'null'], maxLength: 1000 }
    ClientPortfolioEntryPatch:
      type: object
      additionalProperties: false
      required: [lock_version]
      minProperties: 2
      properties:
        informational_status: { type: string, enum: [PENDING, PARTIAL, PAID] }
        note: { type: [string, 'null'], maxLength: 1000 }
        lock_version: { type: integer, minimum: 1 }
