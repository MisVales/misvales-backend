      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        curp_masked: { type: string }
        distributor_id: { type: [string, 'null'], format: uuid }
        branch:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
