        '503': { description: 'M10, M18 o autorización crítica no disponibles' }
  /api/v1/manual-reconciliations/{id}:
    get:
      operationId: getManualReconciliation
      summary: Consulta una solicitud manual visible
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      responses:
        '200': { description: Solicitud visible }
        '404': { description: Fuera de alcance o inexistente }
  /api/v1/manual-reconciliations/{id}/authorize:
    post:
      operationId: authorizeManualReconciliation
      summary: Autoriza una solicitud con reautenticación y separación de funciones
      parameters:
        - { $ref: '#/components/parameters/PublicId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/PaymentReasonedMutation' }
      responses:
        '200': { description: Autorización vinculada una sola vez }
        '403': { description: Autoridad o alcance insuficiente }
        '503': { description: Contrato crítico todavía no integrado }
  /api/v1/manual-reconciliations/{id}/reject:
    post:
      operationId: rejectManualReconciliation
      summary: Rechaza una solicitud manual con motivo
      parameters:
        - { $ref: '#/components/parameters/PublicId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/PaymentReasonedMutation' }
      responses:
        '200': { description: Solicitud rechazada }
        '409': { description: Solicitud en estado incompatible }
        '503': { description: Contrato crítico todavía no integrado }
  /api/v1/manual-reconciliations/{id}/apply:
    post:
      operationId: applyManualReconciliation
      summary: Ejecuta como cajera una autorización válida de un solo uso
      parameters:
        - { $ref: '#/components/parameters/PublicId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/PaymentReasonedMutation' }
      responses:
        '200': { description: Pago aplicado atómicamente }
        '409': { description: 'Autorización vencida, consumida o datos distintos' }
        '503': { description: Contrato de relación no disponible }
  /api/v1/excess-balances:
    get:
      operationId: listExcessBalances
