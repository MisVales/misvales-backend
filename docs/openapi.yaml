        - { name: redemption, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 150 } }
      responses:
        '200': { description: Solicitud rechazada sin movimiento REDEEMED }
