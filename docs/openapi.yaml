      additionalProperties: false
      required: [lock_version]
      minProperties: 2
      properties:
        informational_status: { type: string, enum: [PENDING, PARTIAL, PAID] }
        note: { type: [string, 'null'], maxLength: 1000 }
        lock_version: { type: integer, minimum: 1 }
    VoucherStatus:
      type: string
      enum: [GENERADO, VALIDACION_CAJA, CORRECCION_PENDIENTE, LIBERADO, FERIADO, RECHAZADO, CANCELADO]
    DataChangeRequestStatus:
      type: string
      enum: [PENDIENTE, AUTORIZADO, RECHAZADO, USADO, VENCIDO]
    VersionedVoucherAction:
      type: object
      additionalProperties: false
      required: [lock_version]
