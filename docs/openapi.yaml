      responses:
        '200': { description: Devolución completada una sola vez }
        '403': { description: La cajera está fuera de la sucursal }
        '409': { description: Solicitud o reserva en estado incompatible }
        '503': { description: 'Métodos, campos o evidencia todavía no definidos' }
  /api/v1/refund-requests/{id}/evidence:
    get:
      operationId: accessExcessRefundEvidence
