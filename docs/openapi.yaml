      operationId: rejectVoucherModification
      summary: Rechaza una solicitud conservando el vale en corrección pendiente
      x-permission: voucher_modifications.decide
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherModificationDecisionInput' }
      responses:
        '200': { description: Solicitud rechazada sin token }
        '409': { description: La solicitud ya fue decidida }
