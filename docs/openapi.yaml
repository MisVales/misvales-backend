            application/json:
              schema: { $ref: '#/components/schemas/ExcessBalanceResponse' }
        '404': { description: No pertenece a la distribuidora autenticada }
        '409': { description: 'Versión, idempotencia o decisión incompatible' }
  /api/v1/me/excess-balances/{id}/refund-requests:
    post:
      operationId: requestOwnExcessRefund
