        columns: { type: array, items: { type: string } }
        groupings: { type: array, items: { type: string } }
        totals: { type: array, items: { type: string } }
        modes: { type: array, items: { type: string, enum: [SYNCHRONOUS, ASYNCHRONOUS] } }
        actions:
