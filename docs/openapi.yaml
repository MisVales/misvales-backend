    ClientRegistrationResponse:
      type: object
      properties:
        data:
          type: object
          required: [id, display_name, curp_masked, distributor, branch, registered_at]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            curp_masked: { type: string }
            distributor:
              type: object
              properties:
                id: { type: string, format: uuid }
                number: { type: string }
            branch:
