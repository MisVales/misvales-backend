  /api/v1/reports:
    get:
      operationId: listAvailableReports
      summary: Lista únicamente los reportes autorizados para el actor
      responses:
        '200':
          description: Catálogo cerrado autorizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportDefinition' }
        '403': { description: El rol no tiene acceso al catálogo general }
        '429': { description: Límite técnico excedido }
  /api/v1/reports/{code}/definition:
    get:
      operationId: getReportDefinition
      summary: Obtiene el contrato público autorizado de un reporte
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ReportCode' }
      responses:
        '200':
          description: Definición autorizada
          content: { application/json: { schema: { $ref: '#/components/schemas/ReportDefinitionEnvelope' } } }
        '403': { description: Reporte fuera del permiso del actor }
        '404': { description: Código inexistente o no publicado }
  /api/v1/reports/{code}:
    get:
      operationId: executeSynchronousReport
      summary: Ejecuta una consulta JSON acotada con alcance de sesión
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ReportCode' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: Filas, paginación y resumen con el mismo alcance
          content: { application/json: { schema: { $ref: '#/components/schemas/ReportResponse' } } }
        '403': { description: Permiso o alcance denegado }
        '422': { description: 'Filtro, intervalo u ordenamiento inválido' }
        '503': { description: El módulo propietario aún no publicó el adaptador autoritativo }
  /api/v1/reports/{code}/runs:
    post:
      operationId: createReportRun
      summary: Solicita idempotentemente una corrida asíncrona
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ReportCode' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Corrida encolada
          content: { application/json: { schema: { $ref: '#/components/schemas/ReportRunEnvelope' } } }
        '200': { description: Repetición idempotente de la misma corrida }
        '409': { description: Clave reutilizada con parámetros diferentes }
        '422': { description: Parámetros inválidos }
  /api/v1/report-runs:
    get:
      operationId: listMyReportRuns
      summary: Lista corridas pertenecientes al actor autenticado
      responses:
        '200':
          description: Corridas paginadas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportRun' }
        '403': { description: El rol no tiene acceso a corridas de reportes }
  /api/v1/report-runs/{run}:
    get:
      operationId: getReportRun
      summary: Consulta metadatos de una corrida propia
      parameters:
        - { name: run, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado y metadatos
          content: { application/json: { schema: { $ref: '#/components/schemas/ReportRunEnvelope' } } }
        '404': { description: Corrida inexistente o ajena }
  /api/v1/report-runs/{run}/results:
    get:
      operationId: getReportRunResults
      summary: Consulta el resultado temporal paginado de una corrida propia
      parameters:
        - { name: run, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Resultado protegido paginado
          content: { application/json: { schema: { $ref: '#/components/schemas/ReportResponse' } } }
        '404': { description: Corrida inexistente o ajena }
        '409': { description: Corrida pendiente o fallida }
        '410': { description: Resultado expirado }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    PublicId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RiskAlertId:
      name: alert
      in: path
      required: true
      schema: { type: string, format: uuid }
    RemovalRequestId:
      name: removalRequest
      in: path
      required: true
      schema: { type: string, format: uuid }
    DistributorId:
      name: distributor
      in: path
      required: true
      schema: { type: string, format: uuid }
    CreditIncreaseRequestId:
      name: creditIncreaseRequest
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 160 }
    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientId:
      name: client
      in: path
      required: true
      schema: { type: string, format: uuid }
    VisitId:
      name: visitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión entera leída por el cliente; lock_version puede enviarse en el cuerpo.
      schema: { type: string }
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
  responses:
    AuthScopeDenied:
      description: Actor sin rol, sucursal, asignación o propiedad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }
    CreditLineNotFound:
      description: No existe una línea para la distribuidora
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }
    OnboardingError:
      description: Error de validación, alcance, estado, versión o integración.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientError:
      description: Error uniforme de autenticación, alcance, validación, duplicidad, versión o dependencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  requestBodies:
    Lifecycle:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LifecycleInput' }
    VersionedAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionedActionRequest'
    ReasonAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReasonActionRequest'
    PaymentReasonedMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentReasonedMutationInput'
    PaymentLinkMovement:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [bank_movement_id, lock_version]
            properties:
              bank_movement_id: { type: string, format: uuid }
              lock_version: { type: integer, minimum: 1 }
              authorization_id: { type: [string, 'null'], maxLength: 160 }
    PaymentManualReconciliation:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [bank_movement_id, relation_id, reason, evidence]
            properties:
              bank_movement_id: { type: string, format: uuid }
              relation_id: { type: string, maxLength: 128 }
              clarification_id: { type: [string, 'null'], format: uuid }
              reason: { type: string, minLength: 10, maxLength: 2000 }
              evidence: { type: string, format: binary }
              authorization_id: { type: [string, 'null'], maxLength: 160 }
    ExcessVersionedMutation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [lock_version]
            properties:
              lock_version: { type: integer, minimum: 1 }
    ExcessRefundRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [lock_version]
            properties:
              lock_version: { type: integer, minimum: 1 }
              reason: { type: [string, 'null'], minLength: 3, maxLength: 1000 }
    ExcessRefundDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [lock_version, reauthentication_token]
            properties:
              lock_version: { type: integer, minimum: 1 }
              reauthentication_token: { type: string, minLength: 32, maxLength: 512 }
              reason: { type: [string, 'null'], minLength: 3, maxLength: 1000 }
    ExcessRefundCompletion:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [refund_date, method, reference, lock_version]
            properties:
              refund_date: { type: string, format: date }
              method: { type: string, maxLength: 80 }
              reference: { type: string, maxLength: 160 }
              evidence: { type: string, format: binary }
              method_fields: { type: object, maxProperties: 50 }
              lock_version: { type: integer, minimum: 1 }
  schemas:
    DelinquencyStatus:
      type: string
      enum: [NOT_DELINQUENT, DELINQUENT, REGULARIZED_PENDING_REMOVAL]
    RiskDecisionInput:
      type: object
      additionalProperties: false
      required: [reauthentication_token]
      properties:
        reauthentication_token: { type: string, writeOnly: true, maxLength: 512 }
        reason: { type: [string, 'null'], maxLength: 1000 }
    RemovalPreparationInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, 'null'], maxLength: 1000 }
    ExcessBalanceResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ExcessBalance' }
    ExcessBalance:
      type: object
      additionalProperties: false
      required:
        - id
        - folio
        - estado
        - relacion_origen
        - importe_original
        - importe_pendiente_decision
        - saldo_a_favor_disponible
        - importe_reservado
        - importe_aplicado
        - importe_devuelto
        - moneda
        - acciones_permitidas
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, maxLength: 32 }
        estado:
          type: string
          enum:
            - PENDIENTE_DECISION
            - SALDO_A_FAVOR
            - APLICADO_PARCIAL
            - APLICADO_TOTAL
            - DEVOLUCION_PENDIENTE
            - DEVUELTO
        relacion_origen:
          type: object
          required: [id, folio]
          properties:
            id: { type: string, maxLength: 128 }
            folio: { type: [string, 'null'] }
        importe_original: { type: string, pattern: '^\d+\.\d{2}$' }
        importe_pendiente_decision: { type: string, pattern: '^\d+\.\d{2}$' }
        saldo_a_favor_disponible: { type: string, pattern: '^\d+\.\d{2}$' }
        importe_reservado: { type: string, pattern: '^\d+\.\d{2}$' }
        importe_aplicado: { type: string, pattern: '^\d+\.\d{2}$' }
        importe_devuelto: { type: string, pattern: '^\d+\.\d{2}$' }
        moneda: { type: string, const: MXN }
        fecha_pago_origen: { type: [string, 'null'], format: date }
        lock_version: { type: integer, minimum: 1 }
        acciones_permitidas:
          type: array
          items:
            type: string
            enum: [ELEGIR_SALDO_A_FAVOR, SOLICITAR_DEVOLUCION]
    PaymentReasonedMutationInput:
      type: object
      additionalProperties: false
      required: [reason, lock_version]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000 }
        lock_version: { type: integer, minimum: 1 }
        authorization_id: { type: [string, 'null'], maxLength: 160 }
    ClarificationInput:
      type: object
      additionalProperties: false
      required: [reported_amount, reported_date, reported_reference, description, evidence]
      properties:
        relation_id: { type: [string, 'null'], maxLength: 128 }
        reported_amount: { type: string, pattern: '^\d{1,14}(\.\d{1,4})?$' }
        reported_date: { type: string, format: date }
        reported_reference: { type: string, maxLength: 255 }
        reported_bank_folio: { type: [string, 'null'], maxLength: 160 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        evidence: { type: string, format: binary }
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '20000.00'
      description: Importe decimal serializado como cadena
    CreditMovementType:
      type: string
      enum: [INITIAL_AUTHORIZATION, INCREASE, VOUCHER_FULFILLED, CAPITAL_RECOVERED, AUTHORIZED_CORRECTION]
    CreditIncreaseStatus:
      type: string
      enum: [SOLICITADO, PREAUTORIZADO, RECHAZADO_COORDINADOR, RECHAZADO_GERENTE, AUTORIZADO_TOTAL, AUTORIZADO_PARCIAL, RESTRICCION_50_ACTIVA, COMPLETADO]
    CreditRestriction:
      type: object
      required: [id, status, trigger_type, reference_amount, tolerance_amount, lower_limit, upper_limit, has_admissible_amount]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, BOUND, CONSUMED] }
        trigger_type: { type: string, enum: [INITIAL_AUTHORIZATION, INCREASE] }
        reference_amount: { $ref: '#/components/schemas/Money' }
        tolerance_amount: { $ref: '#/components/schemas/Money' }
        lower_limit: { $ref: '#/components/schemas/Money' }
        upper_limit: { $ref: '#/components/schemas/Money' }
        has_admissible_amount: { type: boolean }
        bound_voucher_id: { type: [string, 'null'] }
    CreditLine:
      type: object
      required: [id, distributor_id, total_authorized, used_balance, available_balance, recovered_capital_total, lock_version]
      properties:
        id: { type: string, format: uuid }
        distributor_id: { type: string, format: uuid }
        total_authorized: { $ref: '#/components/schemas/Money' }
        used_balance: { $ref: '#/components/schemas/Money' }
        available_balance: { $ref: '#/components/schemas/Money' }
        recovered_capital_total: { $ref: '#/components/schemas/Money' }
        lock_version: { type: integer }
        last_movement_at: { type: [string, 'null'], format: date-time }
        restriction:
          oneOf:
            - { $ref: '#/components/schemas/CreditRestriction' }
            - { type: 'null' }
    CreditMovement:
      type: object
      required: [id, type, total_delta, used_delta, total_before, total_after, used_before, used_after, available_before, available_after, source, reason, occurred_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/CreditMovementType' }
        total_delta: { type: string }
        used_delta: { type: string }
        total_before: { $ref: '#/components/schemas/Money' }
        total_after: { $ref: '#/components/schemas/Money' }
        used_before: { $ref: '#/components/schemas/Money' }
        used_after: { $ref: '#/components/schemas/Money' }
        available_before: { $ref: '#/components/schemas/Money' }
        available_after: { $ref: '#/components/schemas/Money' }
        source:
          type: object
          required: [type, id]
          properties: { type: { type: string }, id: { type: string } }
        reason: { type: string }
        configuration_snapshot: { type: [object, 'null'] }
        occurred_at: { type: string, format: date-time }
    CreateCreditIncreaseInput:
      type: object
      required: [requested_amount, reason]
      properties:
        requested_amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 5, maxLength: 2000 }
        origin:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [NORMAL, INSUFFICIENT_CREDIT] }
            product_amount: { $ref: '#/components/schemas/Money' }
    CoordinatorCreditDecisionInput:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [PREAUTHORIZE, REJECT] }
        recommended_amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 5, maxLength: 2000 }
        lock_version: { type: integer, minimum: 1 }
    ManagerCreditDecisionInput:
      type: object
      required: [decision, reason, reauthentication_id]
      properties:
        decision: { type: string, enum: [AUTHORIZE, REJECT] }
        authorized_amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 5, maxLength: 2000 }
        reauthentication_id: { type: string, writeOnly: true }
        lock_version: { type: integer, minimum: 1 }
    CreditIncreaseRequest:
      type: object
      required: [id, folio, distributor_id, requested_amount, status, origin, line_snapshot, reasons, actors, requested_at, lock_version]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        distributor_id: { oneOf: [{ type: string, format: uuid }, { type: integer }] }
        branch_id: { type: integer }
        coordinator_id: { type: integer }
        requested_amount: { $ref: '#/components/schemas/Money' }
        recommended_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        authorized_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        origin: { type: object }
        line_snapshot: { type: object }
        status: { $ref: '#/components/schemas/CreditIncreaseStatus' }
        reasons: { type: object }
        actors: { type: object }
        requested_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        restriction_id: { type: [string, integer, 'null'] }
        lock_version: { type: integer }
    DomainError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              enum: [AUTH_SCOPE_DENIED, REAUTHENTICATION_REQUIRED, RESOURCE_VERSION_CONFLICT, CREDIT_LINE_ALREADY_EXISTS, CREDIT_LINE_NOT_FOUND, CREDIT_INVALID_BALANCE, CREDIT_INSUFFICIENT, CREDIT_50_PERCENT_RULE_NOT_SATISFIED, CREDIT_50_PERCENT_NO_ADMISSIBLE_AMOUNT, CREDIT_RESTRICTION_ALREADY_BOUND, CREDIT_RESTRICTION_NOT_ACTIVE, CREDIT_RESTRICTION_VOUCHER_MISMATCH, CREDIT_INCREASE_INVALID_STATE, CREDIT_INCREASE_AMOUNT_INVALID, CREDIT_INCREASE_NOT_PREAUTHORIZED, CREDIT_INCREASE_EXCEEDS_REQUESTED, CREDIT_MOVEMENT_DUPLICATE, CAPITAL_RECOVERY_EXCEEDS_USED_BALANCE]
            message: { type: string }
            correlationId: { type: string, format: uuid }
    PasswordWithConfirmation:
      type: object
      required: [password, password_confirmation]
      properties:
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        password_confirmation: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    CompleteInvitationInput:
      type: object
      required: [exchange_token]
      properties:
        exchange_token: { type: string, writeOnly: true }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        password_confirmation: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        recovery_codes_confirmed: { type: boolean, description: Segunda fase; confirma que los códigos mostrados fueron guardados }
        mfa:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [PASSKEY, TOTP] }
            secret: { type: string, writeOnly: true }
            code: { type: string, pattern: '^\d{6}$', writeOnly: true }
            credential_identifier: { type: string }
            public_key: { type: string, writeOnly: true }
            attestation_token: { type: string, writeOnly: true }
      anyOf:
        - { required: [password, password_confirmation, mfa] }
        - properties: { recovery_codes_confirmed: { const: true } }
          required: [recovery_codes_confirmed]
    CompleteRecoveryInput:
      allOf:
        - { $ref: '#/components/schemas/PasswordWithConfirmation' }
        - type: object
          required: [token]
          properties:
            token: { type: string, writeOnly: true }
            factor_type: { type: string, enum: [TOTP, RECOVERY_CODE, PASSKEY_AUTHORIZATION] }
            factor_value: { type: string, writeOnly: true }
            mfa: { type: object, description: Requerido para recuperación administrativa }
    ChangePasswordInput:
      allOf:
        - { $ref: '#/components/schemas/PasswordWithConfirmation' }
        - type: object
          required: [reauth_token]
          properties: { reauth_token: { type: string, writeOnly: true } }
    CreateAccountInput:
      type: object
      required: [name, email, role, authorization_token]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/RoleCode' }
        branch_id: { type: [string, 'null'], format: uuid }
        authorization_token: { type: string, writeOnly: true }
    BranchAccountRequestInput:
      type: object
      required: [name, email, role, reason, reauth_token]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [COORDINATOR, VERIFIER, CASHIER] }
        reason: { type: string }
        reauth_token: { type: string, writeOnly: true }
    DecisionInput:
      type: object
      required: [reason, reauth_token]
      properties:
        reason: { type: string }
        reauth_token: { type: string, writeOnly: true }
    LifecycleInput:
