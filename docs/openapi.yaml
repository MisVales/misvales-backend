        birth_state: { type: [string, 'null'], maxLength: 120 }
        birth_city: { type: [string, 'null'], maxLength: 160 }
        address: { $ref: '#/components/schemas/ClientAddressInput' }
        official_identification_media_id: { type: string, format: uuid }
        address_proof_media_id: { type: string, format: uuid }
