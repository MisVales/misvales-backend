        '404': { description: Evidencia inexistente dentro del alcance }
        '503': { description: Contrato privado de archivos todavía no disponible }
  /api/v1/me/points:
    get:
      operationId: getOwnPointBalance
      summary: Consulta la cuenta de puntos de la distribuidora autenticada
      responses:
        '200':
          description: Saldo entero, equivalencia informativa y periodo vigente
          content:
            application/json:
              example:
                data:
                  distributor_id: 7db1dc52-1b2c-4b23-8f74-9c6fa7766f22
                  total_points: 120
                  reserved_points: 30
                  available_points: 90
                  current_point_value: '2.00'
                  available_cash_equivalent: '180.00'
                  redemption_open: false
                  redemption_period: null
        '403': { description: Ruta exclusiva de distribuidora }
  /api/v1/me/points/movements:
    get:
      operationId: listOwnPointMovements
      summary: Lista paginada del libro propio
      parameters:
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: type, in: query, schema: { type: string, enum: [EARNED, LATE_PAYMENT_PENALTY, REDEEMED] } }
        - { name: relation_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Movimientos ordenados por fecha e identificador }
        '401': { description: Sesión requerida }
  /api/v1/distributors/{distributor}/points:
    get:
      operationId: getDistributorPointBalance
      summary: Consulta autorizada de una cuenta
      parameters:
        - { name: distributor, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cuenta dentro del alcance }
        '404': { description: Cuenta inexistente dentro del alcance }
  /api/v1/distributors/{distributor}/points/movements:
    get:
      operationId: listDistributorPointMovements
      summary: Libro paginado autorizado
      parameters:
        - { name: distributor, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Movimientos dentro del alcance }
        '404': { description: Distribuidora fuera del alcance }
  /api/v1/relations/{relation}/points:
    get:
