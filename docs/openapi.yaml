      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      responses:
        '200': { description: Aplicaciones paginadas }
        '404': { description: Fuera de alcance o inexistente }
  /api/v1/me/excess-balances:
    get:
      operationId: listOwnExcessBalances
      summary: Lista los excedentes de la distribuidora autenticada
      responses:
        '200': { description: Excedentes propios paginados }
        '403': { description: La cuenta no es una distribuidora autorizada }
  /api/v1/me/excess-balances/{id}:
    get:
      operationId: getOwnExcessBalance
      summary: Consulta un excedente propio
      parameters: [{ $ref: '#/components/parameters/PublicId' }]
      responses:
        '200': { description: Detalle propio }
        '404': { description: No pertenece a la distribuidora autenticada o no existe }
  /api/v1/me/excess-balances/{id}/credit-balance:
    post:
      operationId: chooseOwnExcessAsCreditBalance
